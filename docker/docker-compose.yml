services:
  recipe-api:
    container_name: recipe-api
    image: python:3.11-slim
    working_dir: /app
    env_file:
      - ../.env
    environment:
      DUCKDB_PATH: /app/data/duckdb/recipes.duckdb
    command: >
      bash -c "pip install --no-cache-dir -r requirements-api.txt &&
      python scripts/build_duckdb_demo.py &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:18000:8000"
    restart: unless-stopped
    networks:
      - web

  streamlit:
    image: python:3.11-slim
    working_dir: /app
    env_file:
      - ../.env
    environment:
      DUCKDB_PATH: /app/data/duckdb/recipes.duckdb
    command: >
      bash -c "pip install --no-cache-dir -r requirements-streamlit.txt &&
      python scripts/build_duckdb_demo.py &&
      streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:18501:8501"
    restart: unless-stopped
    networks:
      - web

  tastagram:
    container_name: tastagram
    image: python:3.11-slim
    working_dir: /app
    env_file:
      - ../.env
    environment:
      TASTAGRAM_API_BASE_URL: http://recipe-api:8000
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn jinja2 requests python-multipart &&
      uvicorn tastagram.app:app --host 0.0.0.0 --port 8080"
    volumes:
      - ..:/app
    ports:
      - "127.0.0.1:18090:8080"
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - recipe-api

networks:
  web:
    external: true
