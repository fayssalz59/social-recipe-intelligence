<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Tastagram{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-icon">🍅</span>
      <span>Tastagram</span>
    </a>
    <nav>
      <a href="/">Recipes</a>
      <a href="/health">Health</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Tastagram · Social recipes structured by AI · Powered by Snowflake, dbt, Airflow and FastAPI
  </footer>
</body>
</html>
